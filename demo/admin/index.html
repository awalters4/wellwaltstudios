         services, portfolio, and FAQ from the browser — every save is a git
         commit, which triggers a Netlify rebuild.

           with the repo/branch/site URL wired automatically.
         · "Sign in with GitHub" is handled by the bundled Netlify Function at
           /oauth — the only setup is a GitHub OAuth app + two env vars
           (SETUP.md → "CMS login"). -->
